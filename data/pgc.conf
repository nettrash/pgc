# 
# PostgreSQL Comparer Configuration
# 

# FROM
FROM_HOST=localhost
FROM_PORT=5432
FROM_USER=postgres
FROM_PASSWORD=postgres
FROM_DATABASE=service
FROM_SCHEME=service
FROM_SSL=true
FROM_DUMP=from.dump

# TO
TO_HOST=localhost
TO_PORT=5432
TO_USER=postgres
TO_PASSWORD=postgres
TO_DATABASE=service
TO_SCHEME=service
TO_SSL=false
TO_DUMP=to.dump

# OUTPUT
OUTPUT=delta.sql
USE_DROP=false

# Emit a migration script that is convenient to run against a live production
# database: indexes are built with CREATE INDEX CONCURRENTLY (and partition-aware
# ONLY parent + per-partition + ATTACH for partitioned tables), foreign keys are
# added NOT VALID and validated afterwards, and indexes are dropped with
# DROP INDEX CONCURRENTLY. The concurrent statements are emitted after the main
# transaction commits (so USE_SINGLE_TRANSACTION still wraps the rest).
# Default: false (output is identical to previous behaviour).
OUTPUT_FOR_PRODUCTION=false

# Emit `set check_function_bodies = false;` as the migration's first statement,
# so PostgreSQL does not resolve the names inside a routine body when the
# routine is created. A safety net for routine ordering: pgc infers what a
# routine calls by reading its source text, so a script that still gets the
# order wrong creates the routine anyway instead of failing on a callee that
# does not exist yet. The cost is that a genuine mistake in a routine body is
# no longer caught while the migration runs.
# Default: false (output is identical to previous behaviour).
GUARD_SQL_ROUTINE_BODIES=false
